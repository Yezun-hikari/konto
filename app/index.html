<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Konto · yezun.de</title>
    <meta name="description" content="Dein zentrales Konto für alle Seiten auf yezun.de: anmelden, registrieren, Passwort und Wiederherstellung." />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f5f6fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1117" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // Apply a saved manual theme before first paint (avoids a flash).
      try {
        var t = localStorage.getItem('konto-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#/konto" aria-label="Konto – Übersicht">Konto</a>
      <div class="topbar-actions">
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="Farbschema wechseln"></button>
      </div>
    </header>
    <main id="app"></main>
    <div id="live" class="sr-only" aria-live="polite" aria-atomic="true"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
