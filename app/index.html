<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Konto · yezun.de</title>
    <meta name="description" content="Dein zentrales Konto für alle Seiten auf yezun.de: anmelden, registrieren, Passwort und Wiederherstellung." />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f7f6f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161514" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // Apply a saved manual theme before first paint (avoids a flash).
      try {
        var t = localStorage.getItem('konto-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <header class="topbar">
      <div class="bar">
        <a class="wordmark" href="#/konto" aria-label="yezun.de Konto, Übersicht"><span>yezun.de</span><span class="wordmark-sub">Konto</span></a>
        <a class="return-link" id="return-link" hidden></a>
      </div>
    </header>
    <main id="app"></main>
    <footer class="footer">
      <div class="bar">
        <span>Ein Konto für alle Seiten auf yezun.de</span>
        <nav class="footer-links" aria-label="Rechtliches">
          <a href="#/datenschutz">Datenschutz</a>
          <a href="#/nutzungsbedingungen">Nutzungsbedingungen</a>
          <button class="link-btn" id="theme-toggle" type="button">Farbschema</button>
        </nav>
      </div>
    </footer>
    <div id="live" class="sr-only" aria-live="polite" aria-atomic="true"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
